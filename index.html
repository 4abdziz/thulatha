<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>جدول الضيافة</title><link rel="icon" type="image/png" sizes="32x32" href="favicon.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#5a1e2d"><meta name="apple-mobile-web-app-title" content="ضيافة الثلاثاء"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta property="og:title" content="جدول الضيافة — طلعة الثلاثاء"><meta property="og:description" content="جدول الضيافة لطلعة الثلاثاء"><meta property="og:type" content="website"><meta property="og:url" content="https://4abdziz.github.io/thulatha/"><meta property="og:image" content="https://4abdziz.github.io/thulatha/icon-512.png"><meta property="og:image:width" content="512"><meta property="og:image:height" content="512"><meta name="twitter:card" content="summary"><style id="css">@font-face{font-family:"Thmanyah Sans";src:url(https://cdn.jsdelivr.net/gh/engdawood/thmanyah-font-web@4266a9d/fonts/thmanyah-sans/woff2/thmanyah-sans-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Thmanyah Sans";src:url(https://cdn.jsdelivr.net/gh/engdawood/thmanyah-font-web@4266a9d/fonts/thmanyah-sans/woff2/thmanyah-sans-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Thmanyah Sans";src:url(https://cdn.jsdelivr.net/gh/engdawood/thmanyah-font-web@4266a9d/fonts/thmanyah-sans/woff2/thmanyah-sans-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Thmanyah Serif Display";src:url(https://cdn.jsdelivr.net/gh/engdawood/thmanyah-font-web@4266a9d/fonts/thmanyah-serif-display/woff2/thmanyah-serif-display-Black.woff2) format("woff2");font-weight:900;font-display:swap}

:root{--font:"Thmanyah Sans",system-ui,"Segoe UI",Tahoma,sans-serif;--display:"Thmanyah Serif Display","Thmanyah Sans",serif;
--bg:#f8f4f2;--ink:#2a1a1f;--muted:#7d6a6f;--coffee:#5a1e2d;--gold:#a8763a;--line:#ecdfdc;
--done-bg:#f4e8ea;--done-ink:#5a1e2d;--done-bd:#b07a86;--cur-bg:#fcf2df;--cur-ink:#7d5a17;--cur-bd:#e0b872;--up-bg:#f7f7f7;--up-ink:#3b4a63;--up-bd:#e8dedb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:400;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 60px}
header{text-align:center;margin-bottom:22px;position:relative;padding-top:6px}
.logo{position:absolute;left:0;top:0;width:64px;height:64px;background:url(logo.png) center/contain no-repeat}
@media (max-width:560px){header{padding-top:50px}.logo{width:44px;height:44px}}
h1{font-family:var(--display);font-weight:900;font-size:clamp(40px,8vw,60px);margin:0;color:var(--coffee);line-height:1.2}
.sub{font-size:20px;font-weight:500;color:var(--gold);margin-top:2px}.sub b{color:#a8763a;font-weight:700}
.orn{width:90px;height:2px;background:var(--gold);margin:12px auto 0;border-radius:2px;opacity:.6}
.next{background:var(--coffee);color:#fff;border-radius:16px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.next .lbl{font-size:13px;opacity:.75}.next .nm{font-size:22px;font-weight:700}.next .dt{text-align:left;font-size:14px;opacity:.9}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--muted);margin:6px 2px 10px}
.legend{display:flex;gap:14px;flex-wrap:wrap}.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block;border:1px solid}
table{width:100%;border-collapse:separate;border-spacing:0 6px}
th{font-weight:700;font-size:13px;color:var(--muted);text-align:right;padding:4px 12px}
td{padding:11px 12px;vertical-align:middle;border-top:1px solid;border-bottom:1px solid}
td:first-child{border-right:4px solid;border-radius:0 12px 12px 0;width:44px;text-align:center;font-weight:700}
td:last-child{border-left:1px solid;border-radius:12px 0 0 12px}
tr.done td{background:var(--done-bg);border-color:var(--done-bd);color:var(--done-ink)}
tr.cur td{background:var(--cur-bg);border-color:var(--cur-bd);color:var(--cur-ink)}
tr.cur td:first-child{border-right-width:6px}
tr.up td{background:var(--up-bg);border-color:var(--up-bd);color:var(--up-ink)}
tr.block td{background:repeating-linear-gradient(-45deg,#f1ecea,#f1ecea 8px,#e9e2df 8px,#e9e2df 16px);border-color:#ddd2ce;color:#8a7f7b;font-size:14px}
.name{font-weight:700;font-size:17px}
.tag{font-size:11px;font-weight:500;padding:1px 8px;border-radius:20px;background:rgba(0,0,0,.06);display:inline-block;margin:0 16px 0 0;white-space:nowrap;vertical-align:middle}
.struck{text-decoration:line-through;opacity:.6}
.h{font-weight:700;white-space:nowrap}.g{font-size:12px;opacity:.75;white-space:nowrap}
.subn{font-weight:700}.empty{opacity:.35}
.skip{font-weight:500;font-style:normal}
select,input[type=text],input[type=password]{font-family:var(--font);font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);max-width:100%}
button{font-family:var(--font);font-weight:500;font-size:14px;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--coffee);padding:7px 14px}
button.pri{background:var(--coffee);color:#fff;border-color:var(--coffee)}
button.danger{color:#b3261e;border-color:#efc4c0}
button.mini{padding:3px 10px;font-size:13px}
.ins td{padding:0;border:none!important;background:none!important}
.ins button{width:100%;border:1px dashed #d6c3c0;background:transparent;color:var(--muted);font-size:12px;padding:2px}
.ins button:hover{background:#faf3f1;color:var(--coffee)}
.acts{display:flex;gap:6px;justify-content:flex-end}
footer{margin-top:22px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.note{display:none;font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
.ov{position:fixed;inset:0;background:rgba(40,15,22,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dlg{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg h3{margin:0 0 12px;font-weight:700;color:var(--coffee)}
.dlg .row{margin:10px 0}.dlg label{display:flex;align-items:center;gap:8px;cursor:pointer}
.dlg .btns{display:flex;gap:8px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
.err{color:#b3261e;font-size:13px;min-height:18px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:12px;font-size:14px;z-index:20}
.toast.bad{background:#b3261e}.att{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}.att-h{font-weight:700;color:var(--coffee);margin-bottom:10px}.att-b{display:flex;gap:10px}.ab{flex:1;font-size:17px;padding:12px;border-radius:12px}.ab.on-y{background:#e5f3e8;border-color:#4D7A51;color:#1d6a3a;font-weight:700}.ab.on-n{background:#fdecea;border-color:#b3261e;color:#b3261e;font-weight:700}.att-l{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}.att-t{font-size:13px;color:var(--muted);margin-bottom:6px}.ag{margin:6px 0;font-size:14px}.lr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}a.wa{background:#25D366;color:#fff;text-decoration:none;border-radius:10px;padding:5px 12px;font-size:13px;font-weight:500;white-space:nowrap}a.wa.big{display:block;text-align:center;padding:10px;font-size:15px;margin-top:10px}.dlg{max-height:85vh;overflow:auto}.st{width:100%;border-collapse:collapse;border-spacing:0;font-size:14px;margin:8px 0}.st th,.st td{border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;padding:8px 4px;text-align:center;background:none!important;color:var(--ink)!important;width:auto!important;font-weight:400}.st th{font-weight:700;font-size:12px;color:var(--muted)!important}.st td:first-child,.st th:first-child{text-align:right}.sr{cursor:pointer}.sr:hover td{background:#faf3f1!important}
@media (max-width:560px){.wrap{padding:18px 8px 50px}.h{font-size:13px}.subn{font-size:14px}select{font-size:13px;padding:5px 4px;max-width:110px}td{padding:9px 6px}th{padding:4px 7px}.name{font-size:15px}td:first-child{width:30px}.acts{flex-direction:column}}
</style></head><body><div id="app"></div><script src="https://script.google.com/macros/s/AKfycbxOW3UGqa_xuQuZx46qf0jWgrrA1cLFHTmvRA8p8IF_ACcP7I3E9_d0-_fl824AJhQ_sg/exec?js=1"></script></body></html>
